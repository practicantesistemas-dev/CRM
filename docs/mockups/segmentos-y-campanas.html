</style>

<script>
/* ---------------- utils ---------------- */
const nf = new Intl.NumberFormat('es-CO');
const money = n => '$' + nf.format(Math.round(n));
const inits = s => (s.match(/[A-Za-zÁÉÍÓÚÑÜáéíóúñü]+/g) || []).filter(w => !['y','de','la','el','del'].includes(w.toLowerCase())).slice(0, 2).map(w => w[0]).join('').toUpperCase();
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = mulberry32(20260903);
const pick = a => a[Math.floor(R() * a.length)];
const chance = p => R() < p;
const rint = (lo, hi) => lo + Math.floor(R() * (hi - lo + 1));
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 4500); }
function toggleTheme(){ const c = document.documentElement.getAttribute('data-theme'); document.documentElement.setAttribute('data-theme', c === 'dark' ? 'light' : c === 'light' ? 'dark' : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark')); }

};

/* ---------------- dataset ---------------- */
const SERVICIOS = ['Consulta médica', 'Laboratorio clínico', 'Ecografía', 'Citología', 'Mamografía', 'Densitometría'];
const SERV_COL = { 'Consulta médica': C.blue, 'Laboratorio clínico': C.teal, 'Ecografía': C.pink, 'Citología': C.gold, 'Mamografía': C.indigo, 'Densitometría': C.slate };
const CIUDADES = ['Pereira', 'Dosquebradas', 'Cartago', 'Santa Rosa de Cabal', 'La Virginia', 'Marsella'];
const EMPRESAS = [
  { n: 'Café y Moda S.A.S.', s: 'Manufactura' }, { n: 'Frisby S.A.', s: 'Alimentos' }, { n: 'Audifarma S.A.', s: 'Salud' },
  { n: 'Comfamiliar Risaralda', s: 'Servicios' }, { n: 'Alcaldía de Dosquebradas', s: 'Sector público' }, { n: 'Postobón — Pereira', s: 'Alimentos' },
];
const SECTORES = [...new Set(EMPRESAS.map(e => e.s))];
const CANALES = ['Feria de salud', 'Web', 'Referido', 'Campaña', 'Redes sociales'];
const RESP = ['María García', 'Juan López', 'Carlos Torres', 'Diana Ríos'];
const FEM = ['María', 'Luz Marina', 'Gloria', 'Rosalba', 'Omaira', 'Amparo', 'Blanca', 'Nubia', 'Deisy', 'Marta Lucía', 'Yenifer', 'Ángela', 'Beatriz', 'Dora', 'Stella', 'Carmenza', 'Luz Dary', 'Claudia'];
const MASC = ['Juan', 'Carlos', 'Gonzalo', 'Gustavo', 'Jhon Freddy', 'Libardo', 'Héctor', 'Andrés', 'Álvaro', 'Sebastián', 'Yojan', 'Diego', 'Óscar', 'Wilson', 'Fernando', 'Jaime', 'Hernán', 'Ramiro'];
const APE = ['Giraldo', 'Restrepo', 'Henao', 'Salazar', 'Loaiza', 'Ospina', 'Vinasco', 'Betancur', 'Nieto', 'Grisales', 'Cardona', 'Muñoz', 'Quintero', 'Jaramillo', 'Arias', 'Gómez', 'Ramírez', 'Aguirre', 'Ceballos', 'Marín', 'Orozco', 'Valencia', 'Bedoya'];
const VALOR = { Individual: 168000, Familiar: 300000, Empresarial: 132000 };

const PERSONAS = Array.from({ length: 60 }, (_, i) => {
  const sexo = chance(0.56) ? 'F' : 'M';
  const nombre = `${sexo === 'F' ? pick(FEM) : pick(MASC)} ${pick(APE)} ${pick(APE)}`;
  const r = R();
  const plan = r < 0.5 ? 'Familiar' : r < 0.8 ? 'Individual' : 'Empresarial';
  const emp = plan === 'Empresarial' ? pick(EMPRESAS) : null;
  const edad = rint(19, 79);
  const estado = chance(0.87) ? 'Activo' : 'Inactivo';
  const nServ = (() => { const q = R(); return q < 0.24 ? 0 : q < 0.5 ? 1 : q < 0.72 ? 2 : q < 0.88 ? 3 : rint(4, 6); })();
  const pool = SERVICIOS.filter(s => (s !== 'Citología' || sexo === 'F') && (s !== 'Mamografía' || (sexo === 'F' && edad >= 38)));
  const weighted = [];
  pool.forEach(s => { const w = s === 'Laboratorio clínico' || s === 'Consulta médica' ? 4 : s === 'Ecografía' ? 2 : 1; for (let k = 0; k < w; k++) weighted.push(s); });
  const usados = new Set();
  while (usados.size < Math.min(nServ, pool.length)) usados.add(pick(weighted));
  const ultimoUso = usados.size ? rint(4, 340) : null;
  const diasVence = rint(1, 364);
  return {
    id: i + 1, nombre, doc: String(rint(24000000, 1130000000)), sexo, edad, plan,
    empresa: emp ? emp.n : '', sector: emp ? emp.s : '', ciudad: pick(CIUDADES), estado,
    canal: plan === 'Empresarial' ? 'Convenio empresarial' : pick(CANALES),
    responsable: pick(RESP),
    tel: chance(0.82) ? `3${rint(0, 2)}${rint(0, 9)} ${rint(100, 999)} ${rint(1000, 9999)}` : '',
    correo: chance(0.66) ? `${nombre.split(' ')[0].toLowerCase()}.${nombre.split(' ')[2].toLowerCase()}@correo.com`.normalize('NFD').replace(/[̀-ͯ]/g, '') : '',
    usados, nServ: usados.size, ultimoUso, diasVence,
    valor: VALOR[plan],
  };
});

const ventanaDe = d => d <= 7 ? 'T-7' : d <= 30 ? 'T-30' : d <= 60 ? 'T-60' : '';

/* ---------------- filter state ---------------- */
const F0 = () => ({
  ciudad: [], plan: [], sector: [], sexo: '', estado: 'Activo', canal: '', responsable: '', empresa: '',
  edadMin: '', edadMax: '', usa: [], noUsa: [], ultimoUso: '', nServ: '', ventana: '',
  conTel: false, conCorreo: false,
});
let state = { mode: 'segmentos', f: F0(), receta: '', sel: new Set(), touched: false, accion: '', prog: 'ahora', msg: '', camp: '', emb: 0 };

const RECETAS = [
  { id: 'sinmamo', label: 'Mujeres 40+ sin mamografía', f: { sexo: 'F', edadMin: '40', noUsa: ['Mamografía'], estado: 'Activo' } },
  { id: 'sinuso90', label: 'Sin uso en 90 días', f: { ultimoUso: '>90', estado: 'Activo' } },
  { id: 'nunca', label: 'Nunca han usado el plan', f: { ultimoUso: 'nunca', estado: 'Activo' } },
  { id: 'menos', label: 'Servicios menos usados (citología / densitometría)', f: { noUsa: ['Citología', 'Densitometría'], estado: 'Activo' } },
  { id: 'conv', label: 'Convenios con bajo uso', f: { plan: ['Empresarial'], nServ: '≤1', estado: 'Activo' } },
  { id: 'venc', label: 'Próximos a vencer sin uso reciente', f: { ventana: 'T-30', ultimoUso: '>90', estado: 'Activo' } },
];

function applyF() {
  const f = state.f;
  return PERSONAS.filter(p => {
    if (f.ciudad.length && !f.ciudad.includes(p.ciudad)) return false;
    if (f.plan.length && !f.plan.includes(p.plan)) return false;
    if (f.sector.length && !f.sector.includes(p.sector)) return false;
    if (f.sexo && p.sexo !== f.sexo) return false;
    if (f.estado && p.estado !== f.estado) return false;
    if (f.canal && p.canal !== f.canal) return false;
    if (f.responsable && p.responsable !== f.responsable) return false;
    if (f.empresa && p.empresa !== f.empresa) return false;
    if (f.edadMin && p.edad < +f.edadMin) return false;
    if (f.edadMax && p.edad > +f.edadMax) return false;
    if (f.usa.length && !f.usa.every(s => p.usados.has(s))) return false;
    if (f.noUsa.length && f.noUsa.some(s => p.usados.has(s))) return false;
    if (f.ultimoUso) {
      if (f.ultimoUso === 'nunca' && p.ultimoUso !== null) return false;
      if (f.ultimoUso === '>90' && !(p.ultimoUso === null || p.ultimoUso > 90)) return false;
      if (f.ultimoUso === '>60' && !(p.ultimoUso === null || p.ultimoUso > 60)) return false;
      if (f.ultimoUso === '>30' && !(p.ultimoUso === null || p.ultimoUso > 30)) return false;
    }
    if (f.nServ) {
      if (f.nServ === '0' && p.nServ !== 0) return false;
      if (f.nServ === '≤1' && p.nServ > 1) return false;
      if (f.nServ === '2+' && p.nServ < 2) return false;
      if (f.nServ === '4+' && p.nServ < 4) return false;
    }
    if (f.ventana && ventanaDe(p.diasVence) !== f.ventana) return false;
    if (f.conTel && !p.tel) return false;
    if (f.conCorreo && !p.correo) return false;
    return true;
  });
}

  state.mode = m;
  document.querySelectorAll('.seg [data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
  document.getElementById('hpill').textContent = m === 'segmentos' ? 'CRM · mockup' : m === 'embudos' ? 'Embudos' : 'Plan Liga · uso';
  document.getElementById('tabs').style.display = m === 'embudos' ? 'flex' : 'none';
  render();
}
function render() {
  if (state.mode === 'segmentos') return renderSeg();
  if (state.mode === 'embudos') return renderEmbudos();
  return renderUso();
}

/* ---------------- SEGMENTOS ---------------- */
function fToggle(key, val, neg) {
  const arr = state.f[key];
  const i = arr.indexOf(val);
  if (i >= 0) arr.splice(i, 1); else arr.push(val);
  state.receta = ''; afterFilterChange();
}
function fSet(key, val) { state.f[key] = state.f[key] === val ? '' : val; state.receta = ''; afterFilterChange(); }
function fSetForce(key, val) { state.f[key] = val; state.receta = ''; afterFilterChange(); }
function fCheck(key, on) { state.f[key] = on; state.receta = ''; afterFilterChange(); }
function clearF() { state.f = F0(); state.f.estado = ''; state.receta = ''; afterFilterChange(); }
function loadReceta(r) {
  state.f = Object.assign(F0(), { estado: '' }, JSON.parse(JSON.stringify(r.f)));
  state.receta = r.id; afterFilterChange();
}
function afterFilterChange() {
  state.sel = new Set(applyF().map(p => p.id));
  state.touched = false;
  renderSeg();
}

function renderSeg() {
  const rows = applyF();
  const rootHTML = `
    <div class="panel">
      <div class="recetas">
        <span class="rl">Recetas</span>
        ${RECETAS.map(r => `<button class="receta ${state.receta === r.id ? 'on' : ''}" onclick='loadReceta(${JSON.stringify(r)})'>${r.label}</button>`).join('')}
      </div>
      <div class="ustrip">${usageCards()}</div>
    </div>
    <div class="seg-wrap">
      <aside class="facets">${facetsHTML()}</aside>
      <div id="results">${resultsHTML(rows)}</div>
    </div>`;
  document.getElementById('root').innerHTML = rootHTML;
}

function usageCards() {
  const total = PERSONAS.filter(p => p.estado === 'Activo').length;
  return SERVICIOS.map(s => {
    const usaron = PERSONAS.filter(p => p.estado === 'Activo' && p.usados.has(s)).length;
    const pct = Math.round(usaron / total * 100);
    const on = state.f.noUsa.includes(s);
    return `<button class="ucard ${on ? 'on' : ''}" onclick="fToggle('noUsa','${s}')" title="Filtrar a quienes NO lo han usado">
      <span class="un"><span class="udot" style="background:${SERV_COL[s]}"></span>${s}</span>
      <span class="ubar"><i style="width:${pct}%;background:${SERV_COL[s]}"></i></span>
      <span class="um">${pct}% lo usó · <b>${total - usaron} sin usar</b> ${on ? '· filtrado ✓' : '→'}</span>
    </button>`;
  }).join('');
}

function chipset(key, opts, neg) {
  return `<div class="chipset">${opts.map(o => `<button class="fchip ${state.f[key].includes(o) ? 'on' + (neg ? ' neg' : '') : ''}" onclick="fToggle('${key}','${o}')">${o}</button>`).join('')}</div>`;
}
function seg2(key, opts) {
  return `<div class="seg2">${opts.map(([v, l]) => `<button class="${state.f[key] === v ? 'on' : ''}" onclick="fSetForce('${key}','${v}')">${l}</button>`).join('')}</div>`;
}
function selField(key, ph, opts) {
  return `<select class="fsel" onchange="fSetForce('${key}', this.value)"><option value="">${ph}</option>${opts.map(o => `<option ${state.f[key] === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
}

      <div class="field"><label>Estado</label>${seg2('estado', [['', 'Todos'], ['Activo', 'Activo'], ['Inactivo', 'Inactivo']])}</div>
      <div class="field"><label>Origen</label>${selField('canal', 'Cualquier canal', [...CANALES, 'Convenio empresarial'])}</div>
      <div class="field"><label>Responsable</label>${selField('responsable', 'Todos', RESP)}</div>
    </div>

      <div class="glab">Empresa / convenio</div>
      <div class="field"><label>Empresa</label>${selField('empresa', 'Todas', EMPRESAS.map(e => e.n))}</div>
      <div class="field"><label>Sector</label>${chipset('sector', SECTORES)}</div>
    </div>
    <div class="fgroup">
      <div class="glab">Uso de servicios</div>

      <label class="fcheck"><input type="checkbox" ${f.conCorreo ? 'checked' : ''} onchange="fCheck('conCorreo', this.checked)"> Solo con correo</label>

}

/* ---- results + selection ---- */
function toggleRow(id) {
  state.touched = true;
  state.sel.has(id) ? state.sel.delete(id) : state.sel.add(id);
  refreshResults();
}
function toggleAll(on) {
  state.touched = true;
  state.sel = on ? new Set(applyF().map(p => p.id)) : new Set();
  refreshResults();
}
function setAccion(a) { state.accion = state.accion === a ? '' : a; state.msg = ''; refreshResults(); }
function setProg(p) { state.prog = p; refreshResults(); }
function refreshResults() { document.getElementById('results').innerHTML = resultsHTML(applyF()); }

}

function accionPanel(selRows) {
  const P = PLANTILLAS[state.accion];
  const reach = state.accion === 'wa' || state.accion === 'camp' ? selRows.filter(p => p.tel).length
    : state.accion === 'mail' ? selRows.filter(p => p.correo).length : selRows.length;
  const excl = selRows.length - reach;
  const msg = state.msg || P.msg;
  const isMsg = state.accion === 'wa' || state.accion === 'mail' || state.accion === 'camp';
  return `
    <div class="apanel ${P.wa ? 'wa' : ''}">
      <div class="ap-h">
        <span class="ai">${IC[P.ic]}</span>
        <div><div class="at">${P.t} · ${reach} destinatarios</div>
          <div class="as">${selRows.length} seleccionados${excl > 0 ? ` · ${excl} sin datos de contacto quedan por fuera` : ''}</div></div>
      </div>
      <div class="ap-b">
        ${state.accion === 'camp' || state.accion === 'wa' || state.accion === 'mail'
          ? `<div><label class="l">Nombre de la campaña</label><input class="ftext" value="${state.camp || 'Reactivación · servicios menos usados'}" oninput="state.camp=this.value"></div>` : ''}
        <div>
          <label class="l">${state.accion === 'tag' ? 'Etiqueta a aplicar' : state.accion === 'task' ? 'Descripción de la tarea' : 'Mensaje'}</label>
          ${state.accion === 'tag'
            ? `<input class="ftext" value="${msg}" oninput="state.msg=this.value">`
            : `<textarea oninput="state.msg=this.value; document.getElementById('cc').textContent=this.value.length">${msg}</textarea>`}
          ${isMsg ? `<div class="vars">${['{nombre}', '{ciudad}', '{plan}', '{link_agenda}'].map(v => `<button onclick="insVar('${v}')">${v}</button>`).join('')}</div>
            <div class="ccount"><span id="cc">${msg.length}</span> caracteres${state.accion === 'wa' ? ' · ~' + Math.ceil(msg.length / 160) + ' segmento(s) SMS/WhatsApp' : ''}</div>` : ''}
          ${state.accion === 'task' ? `<div class="ccount">Se crea una tarea por persona, asignada a su responsable, con vencimiento en 5 días.</div>` : ''}
        </div>
        <div class="ap-row">
          <div><label class="l">Cuándo</label>
            <span class="prog">
              <button class="${state.prog === 'ahora' ? 'on' : ''}" onclick="setProg('ahora')">Ahora</button>
              <button class="${state.prog === 'prog' ? 'on' : ''}" onclick="setProg('prog')">Programar</button>
            </span>
            ${state.prog === 'prog' ? `<input class="ftext" type="datetime-local" style="margin-top:6px;max-width:210px">` : ''}
          </div>
          <button class="send" onclick="enviar(${reach})">${P.send}</button>
        </div>
        <div class="ap-foot">${isMsg ? 'Los envíos salen por el webhook de n8n; se registra una actividad en la bitácora de cada afiliado.' : state.accion === 'task' ? 'Las tareas quedan en el módulo de Relacionamiento.' : 'La etiqueta queda en la ficha de cada contacto y sirve para filtrar después.'}</div>
      </div>
    </div>`;
}
function insVar(v) { state.msg = (state.msg || PLANTILLAS[state.accion].msg) + ' ' + v; refreshResults(); }
function enviar(n) {
  const P = PLANTILLAS[state.accion];
  const when = state.prog === 'ahora' ? 'ahora' : 'programada';
  const m = {
    wa: `✓ Campaña "${state.camp || 'Reactivación'}" creada — ${n} WhatsApp en cola (n8n), ${when}. Se registrará una actividad tipo WhatsApp por afiliado.`,
    mail: `✓ ${n} correos en cola (n8n), ${when}. Se registrará una actividad tipo Correo por afiliado.`,
    camp: `✓ Campaña multicanal creada — ${n} destinatarios, ${when}.`,
    task: `✓ ${n} tareas creadas en Relacionamiento, una por afiliado (vencen en 5 días).`,
    tag: `✓ Etiqueta "${state.msg || 'Reactivación 2026'}" aplicada a ${n} contactos.`,
  }[state.accion];
  toast(m);
}

/* ---------------- USO ---------------- */
function renderUso() {
  const total = PERSONAS.filter(p => p.estado === 'Activo').length;
  const serv = SERVICIOS.map(s => ({ n: s, pct: Math.round(PERSONAS.filter(p => p.estado === 'Activo' && p.usados.has(s)).length / total * 100) })).sort((a, b) => b.pct - a.pct);
  const sinUso = PERSONAS.filter(p => p.estado === 'Activo' && p.ultimoUso === null).length;
  const planes = ['Familiar', 'Individual', 'Empresarial'].map(pl => ({ n: pl, pct: Math.round(PERSONAS.filter(p => p.plan === pl).length / PERSONAS.length * 100) }));
  const step = [1, .82, .66, .52, .42, .34];
  const bar = (l, sub, pct, fill) => `<div class="bar-row"><div class="bar-label">${l}${sub ? `<span>${sub}</span>` : ''}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${fill}"></div></div><div class="bar-val">${pct}%</div></div>`;
  document.getElementById('root').innerHTML = `<div class="panel">
    <div class="metrics">
      <div class="metric"><span class="m-val">${total}</span><span class="m-lab">Afiliados activos (muestra)</span></div>
      <div class="metric"><span class="m-val">${sinUso}</span><span class="m-lab">Sin ningún uso</span></div>
      <div class="metric"><span class="m-val">${Math.round((total - sinUso) / total * 100)}%</span><span class="m-lab">Con al menos un uso</span></div>
    </div>
    <div class="uso-grid">
      <section class="card-lg"><h3>Servicios más usados</h3>
        <div class="bars">${serv.map((s, i) => bar(s.n, '', s.pct, `color-mix(in srgb, var(--accent) ${step[i] * 100}%, var(--surface-2))`)).join('')}</div>
        <p class="note" style="display:block;margin-top:12px">Clic en “Resumen de uso” de un servicio en la vista de Segmentos para filtrar a quienes no lo han usado y lanzarles una campaña.</p>
      </section>
      <section class="card-lg"><h3>Afiliación por plan</h3>
        <div class="bars">${planes.map((p, i) => bar(p.n, '', p.pct, [C.pink, C.blue, C.indigo][i])).join('')}</div>
      </section>
    </div>
  </div>`;
}

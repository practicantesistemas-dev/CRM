server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea archivo real cae a index.html (Vue Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Login/sesion la resuelve el portal principal (emite el JWT que valida backend_crm)
    location /api/auth/ {
        proxy_pass http://backend_principal:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Resto de la API la resuelve el backend del CRM
    location /api/ {
        proxy_pass http://backend_crm:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

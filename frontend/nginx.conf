server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Traefik termina TLS y envía X-Forwarded-Proto=https; si no viene, $scheme (http).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /health {
        proxy_pass http://backend:8000/health;
    }
    # Los archivos en /assets/ llevan hash en el nombre (Vite): son inmutables, se cachean
    # fuerte. index.html en cambio referencia esos hashes, así que nunca debe quedar cacheado
    # por el navegador o un deploy nuevo no se notaría hasta que expire el caché viejo.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

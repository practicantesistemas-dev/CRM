server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El backend vive en el mismo docker-compose bajo el nombre de servicio "backend"
    # (DNS interno del proyecto compose); no se expone al navegador directamente.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # SPA: cualquier ruta que no sea un archivo real cae en index.html (vue-router history mode).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

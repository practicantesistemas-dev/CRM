# Nombre de proyecto fijo: Compose prefija todos los contenedores/redes/volúmenes con esto
# (crm_mercadeo-backend-1, crm_mercadeo-frontend-1, red crm_mercadeo_default...), así que no
# choca con nombres genéricos ("backend", "frontend") que ya pueda tener otro proyecto en el
# mismo servidor Docker. Cada proyecto de Compose además vive en su propia red aislada por
# defecto: esto no toca contenedores, redes ni volúmenes de otros proyectos que ya corran ahí.
name: crm_mercadeo

services:
  backend:
    build:
      context: ./backend_crm_mercadeo
    restart: unless-stopped
    env_file:
      - ./backend_crm_mercadeo/.env
    # Puerto expuesto solo para acceso directo/depuración (ej. http://SERVIDOR:8100/docs).
    # El frontend NO lo usa: le llega por la red interna del proyecto (nginx -> backend:8000).
    # Se deja como respaldo temporal mientras se confirma que el dominio (Traefik) funciona.
    ports:
      - "${CRM_BACKEND_PORT:-8100}:8000"
    networks:
      - default
      - traefik-public
    # Traefik enruta /api y /health de crm.laliga.org.co directo a este contenedor (puerto
    # interno real de uvicorn: 8000, NO el 8100 mapeado al host). priority=100 > la del
    # frontend (1) para que esas rutas no las capture el router "crm" (catch-all del Host).
    # Sin tls.certresolver aca a proposito: cac/cac-api (que ya funcionan en este mismo
    # Traefik) tampoco lo traen, asi que el certresolver esta puesto como DEFAULT en el
    # entrypoint "websecure" dentro de la config del propio Traefik (fuera de este repo) -
    # basta con tls=true para heredarlo, igual que ellos.
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.crm-api.entrypoints=websecure
      - traefik.http.routers.crm-api.rule=Host(`crm.laliga.org.co`) && (PathPrefix(`/api`) || Path(`/health`))
      - traefik.http.routers.crm-api.priority=100
      - traefik.http.routers.crm-api.tls=true
      - traefik.http.services.crm-api.loadbalancer.server.port=8000

  frontend:
    build:
      context: ./frontend
      args:
        VITE_CRM_API_URL: ""
        # Puede quedar vacío a propósito (login local vía proxy same-origin de nginx).
        VITE_PORTAL_PRINCIPAL_URL: ${VITE_PORTAL_PRINCIPAL_URL:-}
        VITE_TABLEAU_CLIENT_ID: ${VITE_TABLEAU_CLIENT_ID:-}
        VITE_TABLEAU_SECRET_ID: ${VITE_TABLEAU_SECRET_ID:-}
        VITE_TABLEAU_SECRET_VALUE: ${VITE_TABLEAU_SECRET_VALUE:-}
        VITE_TABLEAU_USERNAME: ${VITE_TABLEAU_USERNAME:-}
    restart: unless-stopped
    depends_on:
      - backend
    # Ya no se monta el cert autofirmado (frontend/certs): el 443 con TLS ahora lo maneja
    # Traefik (su propio certificado configurado en el entrypoint "websecure"), no el
    # nginx de este contenedor.
    # http://SERVIDOR:8090 sigue funcionando en paralelo como respaldo temporal (sin TLS)
    # hasta confirmar que https://crm.laliga.org.co funciona vía Traefik.
    ports:
      - "${CRM_FRONTEND_PORT:-8090}:80"
    networks:
      - default
      - traefik-public
    # Traefik termina TLS (websecure/443) y reenvia en plano al puerto 80 interno del
    # nginx de este contenedor (el mismo que ya sirve por 8090). priority=1: mas baja que
    # la del backend, para que /api y /health los tome el router "crm-api". Mismo patron
    # que cac (sin tls.certresolver): lo hereda del default puesto en el entrypoint.
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.crm.entrypoints=websecure
      - traefik.http.routers.crm.rule=Host(`crm.laliga.org.co`)
      - traefik.http.routers.crm.priority=1
      - traefik.http.routers.crm.tls=true
      - traefik.http.services.crm.loadbalancer.server.port=80

networks:
  default: {}
  traefik-public:
    external: true
